<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}</style>
<title>Sinfônicas rumo ao Halloween Fest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Press+Start+2P&display=swap">
<style>
/* Layout: palco de arcade — moldura escura centrada, título em letra de banda, legenda de controles embaixo */
:root{
  --night:#130920;      /* fundo da página */
  --plum:#2a1340;       /* moldura */
  --moon:#f6d58a;       /* destaque quente */
  --pumpkin:#f08a24;    /* abóbora */
  --neon:#d04cff;       /* luz de palco */
  --bone:#efe6f5;       /* texto */
  --dim:#a993bd;        /* texto secundário */
  --f-band:"Metal Mania","Pirata One",Georgia,serif;
  --f-pixel:"Press Start 2P",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--bone);font-family:var(--f-pixel);
  background-image:radial-gradient(ellipse at 50% -10%,#3b1858 0%,transparent 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 28px;box-sizing:border-box}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-band);font-weight:400;font-size:clamp(28px,5vw,46px);margin:0;line-height:1;
  color:var(--bone);text-shadow:0 0 18px rgba(208,76,255,.55),0 3px 0 #4a1d6b;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--pumpkin)}
.tag{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.frame{position:relative;background:var(--plum);padding:6px;border-radius:4px;
  box-shadow:0 0 0 2px #4b2470,0 0 40px rgba(208,76,255,.25),0 18px 40px rgba(0,0,0,.6)}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#1a0c2a;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;outline:none;border-radius:2px}
canvas:focus-visible{box-shadow:0 0 0 3px var(--moon)}
.keys{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:10px;color:var(--dim);line-height:1.8}
.keys b{color:var(--moon);font-weight:400;background:#24113a;border:1px solid #4b2470;padding:2px 6px;border-radius:3px;margin-right:6px}
.rotate{display:none;font-size:10px;color:var(--moon);text-align:center;line-height:1.8}
@media (max-width:560px) and (orientation:portrait){.rotate{display:block}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Sinfônicas <span>·</span> rumo ao Halloween Fest</h1>
    <div class="tag">Halloween · 2.400 m até o palco</div>
  </header>
  <div class="frame"><canvas id="game" tabindex="0" aria-label="Jogo Sinfônicas rumo ao Halloween Fest"></canvas></div>
  <p class="rotate">Gire o celular para jogar com a tela maior</p>
  <div class="keys">
    <span><b>Espaço / ↑</b>pular</span>
    <span><b>↓</b>abaixar</span>
    <span><b>P</b>pausar</span>
    <span><b>M</b>som</span>
    <span><b>Toque</b>pular · botão da esquerda abaixa</span>
  </div>
</div>

<script>
(()=>{
const W=960,H=540,GROUND=440,M=10,GOAL_M=2400,GOAL_PX=GOAL_M*M;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr}
resize();addEventListener('resize',resize);

/* ---------- imagens ---------- */
const IMG={};let loaded=0;const keys=Object.keys(ASSETS);
keys.forEach(k=>{const i=new Image();i.onload=()=>loaded++;i.src=ASSETS[k];IMG[k]=i});

/* sprites pixelados feitos em canvas pequeno (morcego, caixa de som, coração, nota) */
function tiny(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g);return c}
function px(g,map,pal){map.forEach((row,y)=>[...row].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}))}
const batPal={'#':'#1b0f22','w':'#3a2147','o':'#ffb02e'};
const BAT=[tiny(17,9,g=>px(g,[
 "##.............##",
 "###...........###",
 "w###..#...#..###w",
 ".w####o###o####w.",
 "..w###########w..",
 "....#########....",
 ".....##...##.....",
 ".................",
 "................."],batPal)),
 tiny(17,9,g=>px(g,[
 ".................",
 "......#...#......",
 "......#####......",
 "...###o###o###...",
 ".w#############w.",
 "w###.#######.###w",
 "##.....###.....##",
 "#...............#",
 "................."],batPal))];
const SPEAKER=tiny(12,14,g=>px(g,[
 "pppppppppppp",
 "pkkkkkkkkkkp",
 "pk..kkkk..kp",
 "pkk.cggc.kkp",
 "pkk.gddg.kkp",
 "pkk.cggc.kkp",
 "pkkkkkkkkkkp",
 "pkk.cggggc.p",
 "pk.cgddddgcp",
 "pk.gdd..ddgp",
 "pk.gdd..ddgp",
 "pk.cgddddgcp",
 "pkk.cggggckp",
 "pppppppppppp"],{p:'#8a52d6',k:'#1c1027','.':'#2b1a3a',c:'#4a3460',g:'#6d5888',d:'#0a0610'}));
const HEART=tiny(9,8,g=>px(g,[
 ".rr...rr.",
 "rrrr.rrrr",
 "rrwrrrrrr",
 "rrrrrrrrr",
 ".rrrrrrr.",
 "..rrrrr..",
 "...rrr...",
 "....r...."],{r:'#ff3d6e',w:'#ffd1dc'}));
const HEART_E=tiny(9,8,g=>px(g,[
 ".kk...kk.",
 "k..k.k..k",
 "k...k...k",
 "k.......k",
 ".k.....k.",
 "..k...k..",
 "...k.k...",
 "....k...."],{k:'#6b4a85'}));
const NOTE=tiny(6,8,g=>px(g,[
 "..####",
 "..#..#",
 "..#..#",
 "..#..#",
 "###.##",
 "######",
 "###...",
 "......"],{'#':'#ffffff'}));

/* camada do meio: túmulos, cerca e árvores secas */
const MID=(()=>{const c=document.createElement('canvas');c.width=960;c.height=110;const g=c.getContext('2d');
  g.fillStyle='#241034';
  for(let x=0;x<960;x+=12){g.fillRect(x,64,4,46)} g.fillRect(0,72,960,4);g.fillRect(0,92,960,4);
  g.fillStyle='#1c0b2a';
  [[60,40],[210,30],[330,48],[520,36],[700,44],[860,32]].forEach(([x,h])=>{g.fillRect(x,110-h,26,h);g.beginPath();g.arc(x+13,110-h,13,Math.PI,0);g.fill()});
  [[150,8],[610,6],[930,8]].forEach(([x])=>{g.fillRect(x,40,6,70);g.fillRect(x-12,56,30,6)});
  g.strokeStyle='#170824';g.lineWidth=7;g.lineCap='round';
  [[420,0],[780,0]].forEach(([x])=>{g.beginPath();g.moveTo(x,110);g.lineTo(x+4,30);g.lineTo(x-22,8);g.moveTo(x+3,50);g.lineTo(x+30,22);g.lineTo(x+44,26);g.moveTo(x+2,70);g.lineTo(x-26,52);g.stroke()});
  return c})();

/* ---------- cantoras ---------- */
const SINGERS=[
 {id:'c1',name:'JOY',power:'PULO ALTO',desc:'o grito leva mais longe',jump:1040,lives:3,dbl:false,color:'#ff7ad9'},
 {id:'c2',name:'JU',power:'+1 VIDA',desc:'aguenta mais um tranco',jump:900,lives:4,dbl:false,color:'#ffb02e'},
 {id:'c3',name:'LANE',power:'PULO DUPLO',desc:'pula de novo no ar',jump:880,lives:3,dbl:true,color:'#9ef0ff'},
 {id:'mel',name:'MEL',power:'SIRIUS AJUDANTE',desc:'o Sirius pega as caixas de som',jump:960,lives:3,dbl:false,color:'#ff5a5a'},
];
const MEL=3,CATH=58;

/* ---------- áudio ---------- */
let AC=null,master=null,muted=false,musicOn=false,nextBeat=0,beatIdx=0;
try{muted=localStorage.getItem('rumo-mute')==='1'}catch(e){}
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination)}catch(e){AC=null}
}
function setMute(m){muted=m;if(master)master.gain.value=m?0:0.5;try{localStorage.setItem('rumo-mute',m?'1':'0')}catch(e){}}
const dist=(()=>{let curve=null;return()=>{if(curve)return curve;const n=1024;curve=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;curve[i]=Math.tanh(x*6)}return curve}})();
function tone(f,dur,type='square',vol=.15,slide=0,when=0){if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.2){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const gn=AC.createGain();gn.gain.value=vol;s.connect(gn);gn.connect(master);s.start()}
const sfx={
 jump:()=>tone(330,.16,'square',.09,500),
 dbl:()=>tone(520,.14,'square',.08,600),
 hit:()=>{noise(.25,.25);tone(140,.3,'sawtooth',.14,-90)},
 coin:()=>{tone(880,.08,'square',.08);tone(1320,.14,'square',.08,0,.07)},
 click:()=>tone(600,.06,'square',.06),
 win:()=>{[0,.18,.36,.6].forEach((w,i)=>{[82.4,123.5,164.8].forEach(f=>chord(f*[1,1.19,1.33,2][i],.9,w))})}
};
function chord(f,dur,when){if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),ws=AC.createWaveShaper(),gn=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;ws.curve=dist();lp.type='lowpass';lp.frequency.value=2200;gn.gain.setValueAtTime(.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(ws);ws.connect(lp);lp.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.05)}
/* riff de fundo: palhetada abafada em Mi, 150 bpm */
const RIFF=[1,0,1,0,1,1,0,1, 1,0,1,0,3,0,2,0, 1,0,1,0,1,1,0,1, 1,0,5,0,4,0,3,2];
const RIFF_F={1:82.4,2:98,3:110,4:123.5,5:130.8};
function music(){
  if(!AC||!musicOn)return;const step=60/150/2;
  while(nextBeat<AC.currentTime+.15){
    const n=RIFF[beatIdx%RIFF.length];const t=nextBeat-AC.currentTime;
    if(n){const f=RIFF_F[n];const len=n===1?step*.7:step*1.8;chordAt(f,len,t,n===1?.035:.045);chordAt(f*1.5,len,t,n===1?.02:.03)}
    if(beatIdx%4===0)kick(t);
    if(beatIdx%8===4)snare(t);
    nextBeat+=step;beatIdx++;
  }
}
function chordAt(f,dur,when,vol){if(!AC||when<0)when=0;const t=AC.currentTime+when;const o=AC.createOscillator(),ws=AC.createWaveShaper(),gn=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;ws.curve=dist();lp.type='lowpass';lp.frequency.value=1500;gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(ws);ws.connect(lp);lp.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.03)}
function kick(when){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);gn.gain.setValueAtTime(.22,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.16)}
function snare(when){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const b=AC.createBuffer(1,AC.sampleRate*.12,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;const gn=AC.createGain();gn.gain.value=.12;s.connect(hp);hp.connect(gn);gn.connect(master);s.start(t)}
function startMusic(){if(!AC)return;musicOn=true;nextBeat=AC.currentTime+.05;beatIdx=0}
function stopMusic(){musicOn=false}

/* ---------- estado ---------- */
let state='select',sel=0,hover=-1,paused=false,isTouch=false;
let bonus=false,cat=null,unlockT=0;
let P,obs,coins,parts,speed,traveled,spawnIn,coinIn,lives,score,coinsGot,invul,shake,stage,arriveT,winT,t=0,best=0;
try{best=+localStorage.getItem('rumo-best')||0}catch(e){}
const input={jump:false,duck:false,jumpPressed:false};

function newGame(){
  const s=SINGERS[sel];
  P={x:150,y:GROUND,vy:0,ground:true,duck:false,canDbl:s.dbl,squash:1,run:0,auto:false};
  obs=[];coins=[];parts=[];speed=330;traveled=0;spawnIn=700;coinIn=900;lives=s.lives;score=0;coinsGot=0;invul=0;shake=0;stage=null;arriveT=0;winT=0;paused=false;
  bonus=sel===MEL;
  cat=bonus?{x:P.x-74,y:GROUND,vy:0,ground:true,run:0,landY:null}:null;
  state='play';startMusic();
}
function catW(){const i=IMG.cat;return i.width*CATH/i.height}
function goUnlock(){state='unlock';unlockT=0;sfx.coin()}
function startMel(){sel=MEL;newGame()}
function toSelect(){state='select';stopMusic();if(sel===MEL)sel=0}

function sprite(){return IMG[SINGERS[sel].id]}
const PH=118;
function pw(){const i=sprite();return i.width*PH/i.height}

/* ---------- entrada ---------- */
function doJump(){
  if(state!=='play'||paused||P.auto)return;
  if(P.ground){P.vy=-SINGERS[sel].jump;P.ground=false;P.squash=1.12;sfx.jump();if(SINGERS[sel].dbl)P.canDbl=true}
  else if(SINGERS[sel].dbl&&P.canDbl){P.vy=-SINGERS[sel].jump*.85;P.canDbl=false;sfx.dbl();burst(P.x+pw()/2,P.y,6,'#9ef0ff')}
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  audio();
  if(k==='m'||k==='M'){setMute(!muted);return}
  if(state==='select'){
    if(k==='ArrowLeft'){sel=(sel+2)%3;sfx.click()}
    if(k==='ArrowRight'){sel=(sel+1)%3;sfx.click()}
    if(k>='1'&&k<='3'){sel=+k-1;sfx.click()}
    if(k==='Enter'||k===' ')newGame();
    return;
  }
  if(state==='over'){
    if(k==='Enter'||k===' ')newGame();
    if(k==='Escape'||k==='c'||k==='C')toSelect();
    return;
  }
  if(state==='win'){if(k==='Enter'||k===' ')goUnlock();return}
  if(state==='unlock'){if(k==='Enter'||k===' ')startMel();return}
  if(state==='final'){if(k==='Enter'||k===' ')toSelect();return}
  if(state==='play'){
    if(k==='p'||k==='P'||k==='Escape'){paused=!paused;paused?stopMusic():startMusic();return}
    if((k===' '||k==='ArrowUp'||k==='w'||k==='W')&&!e.repeat)doJump();
    if(k==='ArrowDown'||k==='s'||k==='S')input.duck=true;
  }
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')input.duck=false});

function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
const BTN={duck:{x:20,y:H-100,w:150,h:80},jump:{x:W-170,y:H-100,w:150,h:80}};
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
let duckPointer=null;
function cardRect(i){const cw=250,gap=30,x0=(W-(cw*3+gap*2))/2;return{x:x0+i*(cw+gap),y:150,w:cw,h:290}}
const BTN_PLAY={x:W/2-150,y:466,w:300,h:50};
const BTN_AGAIN={x:W/2-310,y:452,w:290,h:52},BTN_SWAP={x:W/2+20,y:452,w:290,h:52};
const BTN_MUTE={x:W-58,y:14,w:40,h:34};
const BTN_MEL={x:W/2-180,y:452,w:360,h:56},BTN_END={x:W/2-160,y:482,w:320,h:46};
cv.addEventListener('pointerdown',e=>{
  audio();cv.focus();if(e.pointerType==='touch')isTouch=true;
  const p=toGame(e);
  if(inR(p,BTN_MUTE)){setMute(!muted);return}
  if(state==='select'){
    for(let i=0;i<3;i++)if(inR(p,cardRect(i))){if(sel===i){newGame();return}sel=i;sfx.click();return}
    if(inR(p,BTN_PLAY))newGame();
    return;
  }
  if(state==='over'){
    if(inR(p,BTN_AGAIN))newGame();
    else if(inR(p,BTN_SWAP))toSelect();
    return;
  }
  if(state==='win'){goUnlock();return}
  if(state==='unlock'){if(inR(p,BTN_MEL))startMel();return}
  if(state==='final'){if(inR(p,BTN_END))toSelect();return}
  if(state==='play'){
    if(paused){paused=false;startMusic();return}
    if(isTouch&&inR(p,BTN.duck)){input.duck=true;duckPointer=e.pointerId;return}
    doJump();
  }
});
addEventListener('pointerup',e=>{if(e.pointerId===duckPointer){input.duck=false;duckPointer=null}});
addEventListener('pointercancel',e=>{if(e.pointerId===duckPointer){input.duck=false;duckPointer=null}});
cv.addEventListener('pointermove',e=>{const p=toGame(e);hover=-1;if(state==='select')for(let i=0;i<3;i++)if(inR(p,cardRect(i)))hover=i;
  const over=(state==='select'&&(hover>=0||inR(p,BTN_PLAY)))||(state==='over'&&(inR(p,BTN_AGAIN)||inR(p,BTN_SWAP)))||state==='win'||(state==='unlock'&&inR(p,BTN_MEL))||(state==='final'&&inR(p,BTN_END))||inR(p,BTN_MUTE);cv.style.cursor=over?'pointer':'default'});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused){paused=true;stopMusic()}});

/* ---------- partículas ---------- */
function burst(x,y,n,color,note=false){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*260-60,life:.7+Math.random()*.5,max:1.2,color,note,s:note?3:4})}

/* ---------- atualização ---------- */
function rand(a,b){return a+Math.random()*(b-a)}
function update(dt){
  t+=dt;
  if(AC)music();
  if(state==='win'){winT+=dt;if(winT>3.6)goUnlock();return}
  if(state==='unlock'){unlockT+=dt;return}
  if(state==='final'){winT+=dt;return}
  if(state!=='play'||paused)return;
  const s=SINGERS[sel];
  const prog=Math.min(1,traveled/GOAL_PX);
  let scroll=stage&&stage.stopped?0:speed;
  if(!(stage&&stage.stopped))speed=330+190*prog;

  traveled+=scroll*dt;
  // gerar obstáculos
  if(!stage){
    spawnIn-=scroll*dt;coinIn-=scroll*dt;
    if(spawnIn<=0){
      const opts=['pumpkin'];if(prog>.12)opts.push('bat','pumpkin');if(prog>.3)opts.push('ghost','bat');
      const type=opts[Math.floor(Math.random()*opts.length)];
      if(type==='pumpkin'){const big=Math.random()<.25;obs.push({type,x:W+40,y:GROUND,w:big?66:54,h:big?63:52})}
      if(type==='bat')obs.push({type,x:W+40,y:GROUND-100,w:68,h:36,ph:Math.random()*6});
      if(type==='ghost')obs.push({type,x:W+40,y:GROUND-28,w:58,h:58,ph:Math.random()*6,cyc:Math.random()*2.4});
      // às vezes uma dupla de abóboras
      if(type==='pumpkin'&&prog>.45&&Math.random()<.25)obs.push({type,x:W+40+58,y:GROUND,w:54,h:52});
      spawnIn=rand(440,760)*(speed/400);
    }
    if(coinIn<=0){coins.push({x:W+40,y:GROUND-rand(150,200),bob:Math.random()*6});coinIn=rand(700,1300)}
    if(traveled>=GOAL_PX-900){stage={x:W+40,w:Math.round(IMG.stage.width*.72),h:Math.round(IMG.stage.height*.72),stopped:false}}
  }
  obs.forEach(o=>{o.x-=scroll*dt;if(o.type==='ghost')o.x-=30*dt});
  coins.forEach(c=>c.x-=scroll*dt);
  obs=obs.filter(o=>o.x>-120);coins=coins.filter(c=>c.x>-80);

  // palco chegando
  if(stage){
    if(!stage.stopped){stage.x-=scroll*dt;if(stage.x<=W-stage.w-40){stage.stopped=true;P.auto=true;traveled=GOAL_PX}}
    else{
      arriveT+=dt;
      const floorY=GROUND+10-stage.h+stage.h*(422/480);
      const targetX=stage.x+stage.w*.5-pw()/2;
      if(P.x<targetX-4){P.x+=230*dt;P.run+=dt;if(P.ground&&P.landY==null&&P.x>stage.x+10){P.vy=-760;P.ground=false;P.landY=floorY}}
      let catOk=true;
      if(cat){const cx=P.x-catW()+10;catOk=false;
        if(cat.x<cx){cat.x=Math.min(cx,cat.x+300*dt);cat.run+=dt;if(cat.ground&&cat.landY==null&&cat.x>stage.x+4){cat.vy=-760;cat.ground=false;cat.landY=floorY}}
        if(cat.x>=cx&&cat.ground&&cat.y<=floorY+1)catOk=true}
      if(P.x>=targetX-4&&P.ground&&P.y<=floorY+1&&catOk){winT+=dt;if(winT>.6){finish(true);return}}
    }
  }

  // física da cantora
  P.duck=input.duck&&P.ground&&!P.auto;
  if(!P.ground){P.vy+=(input.duck&&!P.auto?5200:2600)*dt;P.y+=P.vy*dt;
    const floor=P.landY??GROUND;
    if(P.y>=floor&&P.vy>0){P.y=floor;P.vy=0;P.ground=true;P.squash=.82;burst(P.x+pw()/2,P.y,5,'#7a5a3a')}}
  if(!P.auto||P.ground)P.run+=dt*(scroll/330);
  P.squash+=(1-P.squash)*Math.min(1,dt*12);
  invul=Math.max(0,invul-dt);shake=Math.max(0,shake-dt*30);

  // colisões
  const w=pw(),h=P.duck?PH*.6:PH;
  const hb={x:P.x+w*.28,y:P.y-h*.88,w:w*.44,h:h*.85};
  if(!P.auto&&invul<=0){
    for(const o of obs){
      let ob;
      if(o.type==='pumpkin')ob={x:o.x+8,y:o.y-o.h+10,w:o.w-16,h:o.h-12};
      else if(o.type==='bat')ob={x:o.x+12,y:o.y-o.h/2+Math.sin(t*6+o.ph)*6+6,w:o.w-24,h:o.h-14};
      else{const a=ghostAlpha(o);if(a<.55)continue;ob={x:o.x+10,y:o.y-o.h+Math.sin(t*3+o.ph)*10+10,w:o.w-20,h:o.h-16}}
      if(hb.x<ob.x+ob.w&&hb.x+hb.w>ob.x&&hb.y<ob.y+ob.h&&hb.y+hb.h>ob.y){
        lives--;invul=1.4;shake=10;sfx.hit();burst(o.x+o.w/2,ob.y+ob.h/2,10,o.type==='pumpkin'?'#f08a24':o.type==='ghost'?'#ffd6f0':'#5b3a70');
        o.dead=true;if(lives<=0){finish(false);return}
        break;
      }
    }
    obs=obs.filter(o=>!o.dead);
  }
  for(const c of coins){
    const cx=c.x,cy=c.y+Math.sin(t*4+c.bob)*6;
    if(hb.x<cx+48&&hb.x+hb.w>cx&&hb.y<cy+56&&hb.y+hb.h>cy){c.got=true;coinsGot++;score+=100;sfx.coin();burst(cx+24,cy+20,8,'#ffd36b',true)}
  }
  coins=coins.filter(c=>!c.got);
  score=Math.floor(Math.min(traveled,GOAL_PX)/M)+coinsGot*100;
  if(cat){
    const cw=catW();
    if(!P.auto){cat.run+=dt*(scroll/330);
      if(cat.ground){for(const c of coins){if(c.catT)continue;
        const top=c.y+28,h=Math.max(60,GROUND-top),v=Math.sqrt(2*2600*h),tA=v/2600,dx=(c.x+24)-(cat.x+cw/2);
        if(dx>0&&dx<=scroll*tA+6){cat.vy=-v;cat.ground=false;c.catT=true;tone(700,.1,'triangle',.07,400);break}}}}
    if(!cat.ground){cat.vy+=2600*dt;cat.y+=cat.vy*dt;const fl=cat.landY??GROUND;if(cat.y>=fl&&cat.vy>0){cat.y=fl;cat.vy=0;cat.ground=true}}
    for(const c of coins){if(c.got)continue;const cy=c.y+Math.sin(t*4+c.bob)*6;
      if(cat.x+cw-8>c.x&&cat.x+8<c.x+48&&cat.y-CATH+10<cy+56&&cat.y>cy){c.got=true;coinsGot++;sfx.coin();burst(c.x+24,cy+20,8,'#ffd36b',true);parts.push({x:c.x+24,y:cy-6,vx:0,vy:-50,life:1,max:1,txt:'MIAU!'})}}
    coins=coins.filter(c=>!c.got);
    score=Math.floor(Math.min(traveled,GOAL_PX)/M)+coinsGot*100;
  }
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.txt?0:500)*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
}
function ghostAlpha(o){const c=(t+o.cyc)%2.6;if(c<1.4)return 1;if(c<1.8)return 1-(c-1.4)/.4;if(c<2.2)return 0;return (c-2.2)/.4}
function finish(win){
  stopMusic();
  score=Math.floor(Math.min(traveled,GOAL_PX)/M)+coinsGot*100;
  if(win){state=bonus?'final':'win';score+=lives*250;sfx.win();winT=0;parts=[]}else{state='over'}
  if(score>best){best=score;try{localStorage.setItem('rumo-best',best)}catch(e){}}
}

function text(s,x,y,size,color,align='left',font='px'){ctx.font=`${size}px ${font==='px'?'"Press Start 2P",monospace':'"Metal Mania",Georgia,serif'}`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillStyle=color;ctx.fillText(s,x,y)}

function drawWorld(off){

  ctx.fillStyle='#2a0f3e';ctx.fillRect(0,372,W,70);
  let mx=-(off*.45)%960;for(let x=mx;x<W;x+=960)ctx.drawImage(MID,x,334);
  // chão (sua arte)
  const g=IMG.ground,gs=120/g.height,gw=g.width*gs;
  let gx=-(off)%gw;for(let x=gx;x<W;x+=gw)ctx.drawImage(g,x,GROUND-14,gw+1,120);

function drawStage(){
  if(!stage)return;const y=GROUND+10-stage.h;

  for(let i=0;i<3;i++){const cx=stage.x+stage.w*(.35+i*.18),a=Math.sin(t*1.5+i)*.25;ctx.fillStyle='rgba(208,76,255,.08)';ctx.beginPath();ctx.moveTo(cx,y+60);ctx.lineTo(cx-120+a*200,GROUND);ctx.lineTo(cx+60+a*200,GROUND);ctx.fill()}

  for(const o of obs){
    if(o.type==='pumpkin'){ctx.drawImage(IMG.pumpkin,o.x,o.y-o.h,o.w,o.h);
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,140,30,${.12+.06*Math.sin(t*8+o.x)})`;ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y-o.h/2,o.w*.7,o.h*.6,0,0,7);ctx.fill();ctx.restore()}
    else if(o.type==='bat'){const f=BAT[Math.floor(t*10+o.ph)%2];pix(f,o.x,o.y-o.h/2+Math.sin(t*6+o.ph)*6,o.w,o.h)}
    else{const a=ghostAlpha(o);if(a<=0)continue;ctx.save();ctx.globalAlpha=a*.95;const yy=o.y-o.h+Math.sin(t*3+o.ph)*10;ctx.drawImage(IMG.ghost,o.x,yy,o.w,o.h);ctx.restore()}

function drawSinger(x,y,h,opts={}){

  textOut('ESCOLHA SUA CANTORA',W/2,72,40,'#efe6f5','center','band','#2a0f3e',8);
  text('clique na cantora · clique de novo ou ENTER para correr',W/2,106,10,'#a993bd','center');
  for(let i=0;i<3;i++){const r=cardRect(i),s=SINGERS[i],on=i===sel,ho=i===hover;
    ctx.fillStyle=on?'#d04cff':ho?'#6b3fa0':'#3c1d57';ctx.fillRect(r.x-4,r.y-4,r.w+8,r.h+8);
    ctx.fillStyle='#1d0c2c';ctx.fillRect(r.x,r.y,r.w,r.h);
    if(on){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(r.x+r.w/2,r.y+60,10,r.x+r.w/2,r.y+120,170);g.addColorStop(0,'rgba(208,76,255,.35)');g.addColorStop(1,'rgba(208,76,255,0)');ctx.fillStyle=g;ctx.fillRect(r.x,r.y,r.w,r.h);ctx.restore()}
    const img=IMG[s.id],h=on?186:172,w=img.width*h/img.height,bob=on?Math.abs(Math.sin(t*5))*5:0;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(r.x+r.w/2,r.y+206,w*.32,6,0,0,7);ctx.fill();
    ctx.drawImage(img,r.x+r.w/2-w/2,r.y+206-h-bob,w,h);
    text(s.name,r.x+r.w/2,r.y+236,13,on?'#fff':'#d9c8e8','center');
    text(s.power,r.x+r.w/2,r.y+260,10,s.color,'center');
    text(s.desc,r.x+r.w/2,r.y+278,7,'#a993bd','center');
    text(String(i+1),r.x+14,r.y+24,10,on?'#f6d58a':'#6b4a85');
  }
  button(BTN_PLAY,'CORRER PRO SHOW',true,false);
  if(best)text(`RECORDE ${best}`,W-20,H-14,9,'#a993bd','right');
}
function drawPlay(){
  const off=traveled;
  ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawWorld(off);drawStage();
  if(cat)drawCat(cat.x,cat.y,{run:cat.ground&&!(stage&&stage.stopped&&cat.x>=P.x-catW()+9)?cat.run:0,air:!cat.ground,shadowY:cat.landY??GROUND});
  drawObs();
  const fl=P.landY??GROUND;
  drawSinger(P.x,P.y,PH,{run:P.ground&&!P.duck&&!(stage&&stage.stopped&&P.x>=stage.x+stage.w*.5-pw()/2-4)?P.run:0,air:!P.ground,duck:P.duck,squash:P.squash,blink:invul>0,shadowY:P.ground?P.y:fl});
  drawParts();ctx.restore();
  drawHUD();drawMute();
  if(isTouch&&!P.auto){for(const [k,r] of Object.entries(BTN)){ctx.fillStyle=(k==='duck'&&input.duck)?'rgba(208,76,255,.45)':'rgba(26,10,38,.45)';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='rgba(239,230,245,.5)';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h);text(k==='duck'?'▼ ABAIXA':'▲ PULA',r.x+r.w/2,r.y+r.h/2+6,12,'#efe6f5','center')}}
  if(traveled<1400&&!paused){const a=Math.min(1,(1400-traveled)/400);ctx.globalAlpha=a;textOut(isTouch?'TOQUE PARA PULAR':'ESPAÇO PULA · ↓ ABAIXA',W/2,170,14,'#f6d58a','center');if(bonus)textOut('O SIRIUS PEGA AS CAIXAS DE SOM PRA VOCÊ!',W/2,198,11,'#ff9df5','center','px','#1a0a26',5);ctx.globalAlpha=1}
  if(paused){veil(.65);textOut('PAUSA',W/2,H/2,44,'#efe6f5','center','band','#2a0f3e',8);text('P ou toque para continuar',W/2,H/2+40,10,'#a993bd','center')}
}
function drawOver(){
  drawPlay();veil(.72);
  textOut('A PLATEIA FICOU ESPERANDO...',W/2,190,44,'#ff7ab0','center','band','#2a0f3e',8);
  text(`${Math.floor(Math.min(traveled,GOAL_PX)/M)} m de ${GOAL_M} m · ${coinsGot} caixas de som`,W/2,250,11,'#efe6f5','center');
  text(`PONTOS ${score}`,W/2,300,18,'#f6d58a','center');
  text(`RECORDE ${best}`,W/2,332,10,'#a993bd','center');
  button(BTN_AGAIN,'TENTAR DE NOVO',true);button(BTN_SWAP,'TROCAR CANTORA',false);
}
function drawWin(){
  // fundo de show
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12061f');g.addColorStop(1,'#3a0f4e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sh=440,sw=IMG.stage.width*sh/IMG.stage.height,sx=W/2-sw/2,sy=26;
  ctx.drawImage(IMG.stage,sx,sy,sw,sh);
  // holofotes
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){const cx=sx+sw*(.2+i*.2),a=Math.sin(t*1.3+i*1.7)*.5;ctx.fillStyle=i%2?'rgba(208,76,255,.13)':'rgba(255,170,80,.10)';ctx.beginPath();ctx.moveTo(cx,sy+120);ctx.lineTo(W/2-160+a*260,H);ctx.lineTo(W/2+20+a*260,H);ctx.fill()}
  ctx.restore();
  // cantora no palco
  const floor=sy+sh*(422/480);
  const img=sprite(),h=150,w=img.width*h/img.height;
  ctx.save();ctx.globalCompositeOperation='lighter';const sp=ctx.createRadialGradient(W/2,floor-70,10,W/2,floor-70,140);sp.addColorStop(0,'rgba(255,230,180,.35)');sp.addColorStop(1,'rgba(255,230,180,0)');ctx.fillStyle=sp;ctx.fillRect(W/2-160,floor-220,320,240);ctx.restore();
  const bang=Math.abs(Math.sin(t*5.2));
  if(bonus){const ch=78,cw=IMG.cat.width*ch/IMG.cat.height;drawCat(W/2-w/2-cw+6,floor,{h:ch,shadowY:floor})}
  ctx.save();ctx.translate(W/2,floor-bang*6);ctx.rotate(Math.sin(t*5.2)*.06);ctx.scale(1+bang*.02,1-bang*.02);ctx.drawImage(img,-w/2,-h,w,h);ctx.restore();
  if(Math.random()<.12)burst(W/2+rand(-60,60),floor-h,1,'#fff',true);
  parts.forEach(p=>{p.x+=p.vx/60*.4;p.y+=p.vy/60*.6;p.vy+=2;p.life-=1/60});parts=parts.filter(p=>p.life>0);drawParts();
  // plateia
  for(let i=0;i<34;i++){const x=i*30-10,j=Math.abs(Math.sin(t*5.2+i*.9))*10,y=H-28-j;
    ctx.fillStyle=i%3?'#0c0414':'#14071f';ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();ctx.fillRect(x-16,y+8,32,40);
    if(i%3===0){ctx.fillRect(x+10,y-38,6,34);ctx.fillRect(x+8,y-46,3,10);ctx.fillRect(x+15,y-46,3,10)}}
  const vg=ctx.createLinearGradient(0,380,0,470);vg.addColorStop(0,'rgba(18,6,31,0)');vg.addColorStop(.6,'rgba(18,6,31,.7)');vg.addColorStop(1,'rgba(18,6,31,.35)');ctx.fillStyle=vg;ctx.fillRect(0,380,W,H-380);
  if(bonus){
    textOut('O HALLOWEEN FEST COMEÇOU!',W/2,446,40,'#f6d58a','center','band','#2a0f3e',8);
    text(`FIM DE JOGO · PONTOS ${score} · obrigada por jogar!`,W/2,470,10,'#efe6f5','center');
    button(BTN_END,'JOGAR DE NOVO',true);return;
  }
  textOut('O SHOW VAI COMEÇAR!',W/2,420,40,'#f6d58a','center','band','#2a0f3e',8);
  text(`PONTOS ${score} · ${coinsGot} caixas · bônus de vidas ${lives*250}`,W/2,440,9,'#efe6f5','center');
  if(Math.floor(t*2)%2)text('...mas a noite ainda não acabou',W/2,490,11,'#ff9df5','center');
}
function drawUnlock(){
  drawWorld(t*40);veil(.72);
  ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(W/2,300,20,W/2,300,300);g.addColorStop(0,'rgba(255,90,90,.28)');g.addColorStop(1,'rgba(255,90,90,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  const k=Math.min(1,unlockT/.5);const sc=.6+.4*(1-Math.pow(1-k,3));
  ctx.save();ctx.translate(W/2,80);ctx.scale(sc,sc);textOut('Bônus: você desbloqueou a cantora Mel',0,0,40,'#ff5a5a','center','band','#2a0f3e',8);ctx.restore();
  text('ela vai correr até o palco com a ajuda do Sirius',W/2,116,10,'#efe6f5','center');
  for(let i=0;i<6;i++){const a=t*1.2+i;pix(NOTE,W/2+Math.cos(a)*230-9,250+Math.sin(a*1.3)*110,18,24)}
  const img=IMG.mel,h=250,w=img.width*h/img.height,bob=Math.abs(Math.sin(t*4))*6,floor=420;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(W/2+20,floor,w*.36,8,0,0,7);ctx.fill();
  ctx.drawImage(img,W/2+20-w/2,floor-h-bob,w,h);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(W/2+20-w/2-50,floor,46,6,0,0,7);ctx.fill();
  const ci=IMG.cat,ch=CATH*1.6,cwi=ci.width*ch/ci.height;ctx.drawImage(ci,W/2+20-w/2-cwi-6,floor-ch-Math.abs(Math.sin(t*4+1))*4,cwi,ch);
  button(BTN_MEL,'CORRER COM A MEL',true);
}

function frame(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;
  if(loaded<keys.length){ctx.fillStyle='#1a0c2a';ctx.fillRect(0,0,W,H);text('CARREGANDO...',W/2,H/2,14,'#efe6f5','center');return}
  if(state==='select')drawSelect();
  else if(state==='play')drawPlay();
  else if(state==='over')drawOver();
  else if(state==='win'||state==='final')drawWin();
  else if(state==='unlock')drawUnlock();
  if(state!=='play')drawMute();
}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(loaded>=keys.length)update(dt);frame();requestAnimationFrame(loop)}
(document.fonts?Promise.race([document.fonts.load('16px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(()=>document.fonts.load('40px "Metal Mania"')).catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(loop));
})();
</script>
